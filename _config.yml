# Jekyll settings (GitHub Pages reads this file automatically).

# Used for link previews, Google's recipe data and the sitemap
title: Fairvopia
description: A mission to explore the world through cooking. Home-cooked recipes from around the globe.
author: Antoine Bichara
url: "https://www.fairvopia.com"

# Builds sitemap.xml so search engines can find every recipe
plugins:
  - jekyll-sitemap

# Each recipe lives in the _recipes folder and is published at the same
# address as before, e.g. _recipes/fatayer.html -> www.fairvopia.com/fatayer.html
collections:
  recipes:
    output: true
    permalink: /:path:output_ext

defaults:
  - scope:
      type: recipes
    values:
      layout: recipe
  # Google Search Console's ownership check file: keep it, but out of the sitemap
  - scope:
      path: "google9adb0c7771283a40.html"
    values:
      sitemap: false

exclude:
  - README.md
  - LICENSE

# Keep straight quotes, "--" and "..." exactly as typed in recipes
kramdown:
  smart_quotes: ["apos", "apos", "quot", "quot"]
  typographic_symbols: { hellip: "...", mdash: "---", ndash: "--", laquo: "<<", raquo: ">>", laquo_space: "<< ", raquo_space: " >>" }
