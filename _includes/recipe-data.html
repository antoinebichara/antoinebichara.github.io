{% comment %}
  All listed recipes as window.FAIRVOPIA_RECIPES, for the globe (js/recipe-globe.js)
  and the filters/search (js/recipe-finder.js). Built from the files in _recipes/.
{% endcomment %}
{%- assign data_recipes = site.recipes | where_exp: "recipe", "recipe.hidden != true" | reverse -%}
<script>
window.FAIRVOPIA_RECIPES = [
{%- for recipe in data_recipes %}{% if recipe.coords %}
{%- assign ing_html = recipe.content | split: '<h2 id="steps">' | first | split: '<h2 id="ingredients">' | last -%}
{%- assign ing_items = ing_html | split: '<li>' %}
    {"title": {{ recipe.title | jsonify }}, "url": {{ recipe.url | remove_first: '/' | jsonify }}, "date": {{ recipe.date | date: "%B %-d, %Y" | jsonify }}, "image": {{ recipe.image | jsonify }}, "thumb": {{ recipe.image | prepend: "thumbs/" | jsonify }}, "location": {{ recipe.location | jsonify }}, "country": {{ recipe.country | jsonify }}, "lat": {{ recipe.coords[0] }}, "lng": {{ recipe.coords[1] }}, "favorite": {% if recipe.favorite %}true{% else %}false{% endif %}, "type": {{ recipe.type | default: "main" | jsonify }}, "vegetarian": {% if recipe.vegetarian %}true{% else %}false{% endif %}, "time": {{ recipe.time | default: "null" }}, "overnight": {% if recipe.overnight %}true{% else %}false{% endif %},
     "ingredients": [{%- for li in ing_items offset: 1 -%}{{ li | split: '</li>' | first | strip_html | normalize_whitespace | strip | jsonify }}{% unless forloop.last %}, {% endunless %}{%- endfor -%}]},
{%- endif %}{% endfor %}
];
</script>
