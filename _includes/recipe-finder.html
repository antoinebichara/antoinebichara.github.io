{% comment %} Filter buttons and "What can I make?" (js/recipe-finder.js) {% endcomment %}
<div class="recipe-finder">
    <div class="rf-find">
        <i class="fa fa-search" aria-hidden="true"></i>
        <input id="rf-query" type="search" autocomplete="off" aria-label="Search recipes" placeholder="Search recipes by dish or country, e.g. paella, Thai, Lebanon">
    </div>
    <div class="rf-filters" role="group" aria-label="Show only">
        <button type="button" class="rf-filter active" data-filter="all">All</button>
        <button type="button" class="rf-filter" data-filter="main">Mains</button>
        <button type="button" class="rf-filter" data-filter="soup">Soups</button>
        <button type="button" class="rf-filter" data-filter="dessert">Desserts</button>
        <button type="button" class="rf-filter" data-filter="baking">Breads &amp; baking</button>
        <button type="button" class="rf-filter" data-filter="side">Sides &amp; snacks</button>
        <button type="button" class="rf-filter" data-filter="vegetarian">Vegetarian</button>
        <button type="button" class="rf-filter rf-filter-passport" data-filter="cooked" hidden><i class="fa fa-check-circle" aria-hidden="true"></i> My passport</button>
    </div>
    <div class="rf-time-row">
        <div class="rf-times" role="group" aria-label="Time available">
            <span class="rf-row-label"><i class="fa fa-clock-o" aria-hidden="true"></i> Time</span>
            <button type="button" class="rf-time active" data-max="">Any</button>
            <button type="button" class="rf-time" data-max="30">Under 30 min</button>
            <button type="button" class="rf-time" data-max="60">Under 1 hr</button>
            <button type="button" class="rf-time" data-max="120">Under 2 hrs</button>
        </div>
        <label class="rf-sort">Sort
            <select id="rf-sort">
                <option value="newest">Newest first</option>
                <option value="quickest">Quickest first</option>
            </select>
        </label>
    </div>
    <div class="rf-search">
        <label for="rf-input">What can I make?</label>
        <div class="rf-box">
            <span class="rf-chips"></span>
            <input id="rf-input" type="text" autocomplete="off" placeholder="Type what you have, e.g. chicken, rice, coconut milk">
        </div>
        <p class="rf-help">Press Enter or a comma after each ingredient. Salt, pepper, oil, water and sugar are assumed.</p>
    </div>
    <div class="rf-results" aria-live="polite"></div>
</div>
